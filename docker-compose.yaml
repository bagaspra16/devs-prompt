services:
  devs-prompt:
    build:
      context: .
      dockerfile: Dockerfile
    image: devs-prompt:latest
    container_name: devs-prompt-app
    ports:
      - "3000:3000"
    env_file:
      - .env.local # loaded when file exists (local dev / CI)
    environment:
      - NODE_ENV=production
      # Override GROQ_API_KEY here or via .env.local
      # - GROQ_API_KEY=your_key_here
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:3000/api/health", "||", "exit", "1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
